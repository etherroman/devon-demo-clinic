server:
  port: ${PORT:8081}
spring:
  application:
    name: devon-demo-clinic
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/clinic;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  h2:
    console:
      enabled: false
